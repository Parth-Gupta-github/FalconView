<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline-first tactical mapping — mark, track, measure and navigate on any device, even off the grid. Built with Flutter & MapLibre.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="FalconView">
  <meta property="og:description" content="Offline-first tactical mapping — mark, track, measure and navigate on any device, even off the grid.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FalconView">
  <meta name="twitter:description" content="Offline-first tactical mapping for every platform.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="falconview">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FalconView</title>
  <link rel="manifest" href="manifest.json">

  <!-- MapLibre GL JS — required by maplibre_gl on the web platform -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- Hide MapLibre GL JS default controls on web; we render our own FABs.
       Keep attribution visible (required by OSM/OpenFreeMap) but shrink and
       lift it so it doesn't sit under the bottom action panel. -->
  <style>
    .maplibregl-ctrl-geolocate,
    .maplibregl-ctrl-zoom-in,
    .maplibregl-ctrl-zoom-out,
    .maplibregl-ctrl-compass {
      display: none !important;
    }
    .maplibregl-ctrl-bottom-right,
    .maplibregl-ctrl-bottom-left {
      bottom: 80px !important;
    }
    .maplibregl-ctrl-attrib {
      font-size: 10px !important;
      background: rgba(255, 255, 255, 0.7) !important;
    }
  </style>

  <!-- Pin the map attribution to a compact "(i)" button on web, so it matches
       the native (Android/iOS) builds and the desktop WebView, which already
       show a compact attribution. MapLibre's web default is responsive
       (a small "(i)" on narrow screens, but expanded text on wide ones); we
       keep it compact everywhere, so the credits always sit behind one "(i)"
       that opens on click. MapLibre's own button + click handler do the
       toggling — we just keep the `maplibregl-compact` class applied. -->
  <script>
    (function () {
      function pinCompact() {
        document
          .querySelectorAll('.maplibregl-ctrl-attrib:not(.maplibregl-compact)')
          .forEach(function (el) { el.classList.add('maplibregl-compact'); });
      }
      // Re-apply whenever the control is (re)created or MapLibre flips it back
      // to expanded on a resize. The :not() guard makes this loop-safe.
      new MutationObserver(pinCompact).observe(document.documentElement, {
        childList: true, subtree: true, attributes: true, attributeFilter: ['class'],
      });
      window.addEventListener('resize', pinCompact);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
